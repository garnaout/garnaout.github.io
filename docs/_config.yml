# Site settings. Edit these, commit, and GitHub Pages rebuilds the site.

title: Georges Arnaout
tagline: Customer Success advisor
description: >-
  Georges Arnaout advises SaaS leadership teams and investors on retention,
  expansion, and redesigning Customer Success around AI agents.
lang: en
author:
  name: Georges Arnaout

# How people reach you. Leave email empty to show LinkedIn only.
linkedin: https://www.linkedin.com/in/garnaout/
email: ""

# Your photo, shown in the About section. Add the file to assets/img/ and put
# its path here, for example: /assets/img/georges-arnaout.jpg
# While this is empty the site shows a monogram instead.
photo: ""

# url and baseurl are deliberately not set. GitHub Pages fills them in from the
# repository, so the site works at garnaout.github.io/<repo>/ or on a custom
# domain without changes. Only set them if you host somewhere else.
# url: https://www.example.com
# baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

exclude:
  - README.md
  - POST-TEMPLATE.md
  - Gemfile
  - Gemfile.lock
  - vendor
