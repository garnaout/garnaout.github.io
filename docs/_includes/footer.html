<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__name">Georges Arnaout, Ph.D.</p>
    <ul class="site-footer__links">
      <li><a href="{{ site.linkedin }}" rel="me noopener">LinkedIn</a></li>
      {%- if site.email and site.email != "" %}
      <li><a href="mailto:{{ site.email }}">Email</a></li>
      {%- endif %}
      <li><a href="{{ '/blog/' | relative_url }}">Writing</a></li>
      <li><a href="{{ '/research/' | relative_url }}">Research</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
    <p class="site-footer__legal">&copy; {{ site.time | date: "%Y" }} Georges Arnaout. Madrid, Spain.</p>
  </div>
</footer>
